cost_to_operate:
  note: >-
    The cost that does exist is operational, and it falls on whoever runs the infrastructure. Users
    who cannot rely on the public-good instance are directed to run their own Fulcio, Rekor and TUF
    root — see https://docs.sigstore.dev/cosign/system_config/custom_components/. Commercial hosted
    Sigstore offerings exist from third parties; none is a Cosign product.
