description: >-
  Cosign publishes no plans and no pricing, and this is not an omission — it is an Apache-2.0 open
  source project of the OpenSSF, and the Sigstore public-good instance it talks to is free to use for
  everyone with no account, no key and no billing relationship. There is no signup, no paid tier and
  no enterprise "contact us" form. This file replaces a 2026-05-04 bulk-sweep scaffold that invented
  a "Free" tier with an "API Requests" quota; no such tier or quota exists.
